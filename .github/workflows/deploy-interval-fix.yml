name: Deploy interval counter fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-interval-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bspatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff

      - name: Apply verified interval fix delta
        run: |
          OLD='_expo/static/js/web/index-9b924f462ab661c8987956aa23782994.js'
          NEW='_expo/static/js/web/index-a5dfac3acb6af7d84f3759e1f6b7d637.js'
          test -f "$OLD"
          test "$(stat -c%s "$OLD")" = '1882394'
          base64 -d interval-fix.patch.b64 > /tmp/interval-fix.patch
          test "$(stat -c%s /tmp/interval-fix.patch)" = '509'
          bspatch "$OLD" "$NEW" /tmp/interval-fix.patch
          test "$(stat -c%s "$NEW")" = '1882505'
          test "$(git hash-object "$NEW")" = 'c2e18053d3c43406bb326736ac97223b6398cb7a'
          sed -i 's/index-9b924f462ab661c8987956aa23782994.js/index-a5dfac3acb6af7d84f3759e1f6b7d637.js/' index.html
          sed -i 's/7.1.4-9/7.1.4-10/' sw.js
          git rm "$OLD"

      - name: Verify public payload
        run: |
          grep -q 'index-a5dfac3acb6af7d84f3759e1f6b7d637.js' index.html
          grep -q '7.1.4-10' sw.js
          test -f '_expo/static/js/web/index-a5dfac3acb6af7d84f3759e1f6b7d637.js'

      - name: Commit deployment and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm interval-fix.patch.b64
          git rm .github/workflows/deploy-interval-fix.yml
          git add index.html sw.js _expo/static/js/web
          git commit -m 'Deploy interval target-transition counter fix'
          git push origin HEAD:main
