name: Deploy persistent smoke button and reminder clarity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-smoke-action-dock.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bspatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff

      - name: Apply and verify exact compiled PWA patch
        run: |
          set -euo pipefail
          OLD='_expo/static/js/web/index-eaa914600f1f222b712e73b5bd8edf61.js'
          NEW='_expo/static/js/web/index-4abdec03c1d373189d0b8eb269ccb4fc.js'
          test -f "$OLD"
          test "$(stat -c%s "$OLD")" = '1887886'
          base64 -d smoke-action-dock.patch.b64 > /tmp/smoke-action-dock.patch
          test "$(stat -c%s /tmp/smoke-action-dock.patch)" = '1331'
          bspatch "$OLD" "$NEW" /tmp/smoke-action-dock.patch
          test "$(stat -c%s "$NEW")" = '1889194'
          test "$(git hash-object "$NEW")" = '1ca8e3a07c95ac82ce38dbe4f79a597ebc48a7b0'
          grep -q 'index-eaa914600f1f222b712e73b5bd8edf61.js' index.html
          sed -i 's/index-eaa914600f1f222b712e73b5bd8edf61.js/index-4abdec03c1d373189d0b8eb269ccb4fc.js/g' index.html
          grep -q '7.1.4-12' sw.js
          sed -i 's/7.1.4-12/7.1.4-13/g' sw.js
          git rm "$OLD"
          test -f "$NEW"
          grep -q 'index-4abdec03c1d373189d0b8eb269ccb4fc.js' index.html

      - name: Commit public deployment and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm smoke-action-dock.patch.b64
          git rm .github/workflows/deploy-smoke-action-dock.yml
          git add -A
          git commit -m 'Deploy persistent smoke logging action and reminder status'
          git push origin HEAD:main
