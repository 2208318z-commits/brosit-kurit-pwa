name: Deploy restored progressive colors

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-color-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bspatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff

      - name: Apply verified color feedback delta
        run: |
          OLD='_expo/static/js/web/index-1ddd7057117fa1a9f5430d74d9a0ee46.js'
          NEW='_expo/static/js/web/index-cb18936c39ec09b03550053c068008f0.js'
          test -f "$OLD"
          test "$(stat -c%s "$OLD")" = '1880985'
          base64 -d color-feedback.patch.b64 > /tmp/color-feedback.patch
          test "$(stat -c%s /tmp/color-feedback.patch)" = '1622'
          bspatch "$OLD" "$NEW" /tmp/color-feedback.patch
          test "$(stat -c%s "$NEW")" = '1882009'
          test "$(git hash-object "$NEW")" = '8c544eab3b7caaff30afdefd92dfab2226038c0d'
          sed -i 's/index-1ddd7057117fa1a9f5430d74d9a0ee46.js/index-cb18936c39ec09b03550053c068008f0.js/' index.html
          sed -i 's/7.1.4-7/7.1.4-8/' sw.js
          git rm "$OLD"

      - name: Verify public payload
        run: |
          grep -q 'index-cb18936c39ec09b03550053c068008f0.js' index.html
          grep -q '7.1.4-8' sw.js
          test -f '_expo/static/js/web/index-cb18936c39ec09b03550053c068008f0.js'

      - name: Commit deployment and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm color-feedback.patch.b64
          git rm .github/workflows/deploy-color-feedback.yml
          git add index.html sw.js _expo/static/js/web
          git commit -m 'Deploy restored progressive color feedback'
          git push origin HEAD:main
