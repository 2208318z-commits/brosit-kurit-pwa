name: Deploy corrected TARaS gait

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-taras-gait.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bspatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff

      - name: Apply verified TARaS gait delta
        run: |
          OLD='_expo/static/js/web/index-cb18936c39ec09b03550053c068008f0.js'
          NEW='_expo/static/js/web/index-9b924f462ab661c8987956aa23782994.js'
          test -f "$OLD"
          test "$(stat -c%s "$OLD")" = '1882009'
          base64 -d taras-gait.patch.b64 > /tmp/taras-gait.patch
          test "$(stat -c%s /tmp/taras-gait.patch)" = '1220'
          bspatch "$OLD" "$NEW" /tmp/taras-gait.patch
          test "$(stat -c%s "$NEW")" = '1882394'
          test "$(git hash-object "$NEW")" = 'e57c4abb2f2f8ac6d195c8bead976b7c49adeb48'
          sed -i 's/index-cb18936c39ec09b03550053c068008f0.js/index-9b924f462ab661c8987956aa23782994.js/' index.html
          sed -i 's/7.1.4-8/7.1.4-9/' sw.js
          git rm "$OLD"

      - name: Verify public payload
        run: |
          grep -q 'index-9b924f462ab661c8987956aa23782994.js' index.html
          grep -q '7.1.4-9' sw.js
          test -f '_expo/static/js/web/index-9b924f462ab661c8987956aa23782994.js'

      - name: Commit deployment and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm taras-gait.patch.b64
          git rm .github/workflows/deploy-taras-gait.yml
          git add index.html sw.js _expo/static/js/web
          git commit -m 'Deploy corrected TARaS Interstellar gait'
          git push origin HEAD:main
