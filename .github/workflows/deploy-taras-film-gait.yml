name: Deploy refined TARaS film gait

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-taras-film-gait.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bspatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff

      - name: Apply verified TARaS bundle delta
        run: |
          OLD='_expo/static/js/web/index-893e20386dc140992916f579cbcbb53d.js'
          NEW='_expo/static/js/web/index-1ddd7057117fa1a9f5430d74d9a0ee46.js'
          test -f "$OLD"
          test "$(stat -c%s "$OLD")" = '1880650'
          cat > /tmp/taras.patch.b64 <<'PATCHB64'

PATCHB64
          base64 -d /tmp/taras.patch.b64 > /tmp/taras.patch
          bspatch "$OLD" "$NEW" /tmp/taras.patch
          test "$(stat -c%s "$NEW")" = '1880985'
          test "$(git hash-object "$NEW")" = '351ed12e9b05403e65a144bd9a10dd48d143ce10'
          sed -i 's/index-893e20386dc140992916f579cbcbb53d.js/index-1ddd7057117fa1a9f5430d74d9a0ee46.js/' index.html
          sed -i 's/7.1.4-6/7.1.4-7/' sw.js
          git rm "$OLD"

      - name: Verify public payload
        run: |
          grep -q 'index-1ddd7057117fa1a9f5430d74d9a0ee46.js' index.html
          grep -q '7.1.4-7' sw.js
          test -f '_expo/static/js/web/index-1ddd7057117fa1a9f5430d74d9a0ee46.js'

      - name: Commit deployment and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/deploy-taras-film-gait.yml
          git add index.html sw.js _expo/static/js/web
          git commit -m 'Deploy refined TARaS film-like gait'
          git push origin HEAD:main
