name: Deploy cessation algorithm v8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-algorithm-v8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install bspatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff

      - name: Apply verified v8 bundle delta
        run: |
          OLD='_expo/static/js/web/index-514d1157fe31680bff015e1cd09693ff.js'
          NEW='_expo/static/js/web/index-eaa914600f1f222b712e73b5bd8edf61.js'
          test -f "$OLD"
          test "$(stat -c%s "$OLD")" = '1882916'
          base64 -d algorithm-v8.patch.b64 > /tmp/algorithm-v8.patch
          test "$(stat -c%s /tmp/algorithm-v8.patch)" = '4828'
          bspatch "$OLD" "$NEW" /tmp/algorithm-v8.patch
          test "$(stat -c%s "$NEW")" = '1887886'
          test "$(git hash-object "$NEW")" = '3c6299f53ce84c60a6028240a28cf411e827643d'
          sed -i 's/index-514d1157fe31680bff015e1cd09693ff.js/index-eaa914600f1f222b712e73b5bd8edf61.js/' index.html
          sed -i 's/7.1.4-11/7.1.4-12/' sw.js
          git rm "$OLD"

      - name: Verify public payload
        run: |
          grep -q 'index-eaa914600f1f222b712e73b5bd8edf61.js' index.html
          grep -q '7.1.4-12' sw.js
          test -f '_expo/static/js/web/index-eaa914600f1f222b712e73b5bd8edf61.js'

      - name: Commit deployment and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm algorithm-v8.patch.b64
          git rm .github/workflows/deploy-algorithm-v8.yml
          git add index.html sw.js _expo/static/js/web
          git commit -m 'Deploy cessation algorithm v8'
          git push origin HEAD:main
